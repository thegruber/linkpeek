<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{title}} · linkpeek</title>
		<meta name="description" content="{{description}}" />
		<meta name="robots" content="index,follow,max-image-preview:large" />
		<link rel="canonical" href="{{canonical}}" />
		<link rel="describedby" type="text/markdown" href="{{base}}llms.txt" />
		<link rel="alternate" type="text/markdown" href="{{alternate}}" />
		<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="linkpeek" />
		<meta property="og:title" content="{{title}} · linkpeek" />
		<meta property="og:description" content="{{description}}" />
		<meta property="og:url" content="{{canonical}}" />
		<meta property="og:image" content="{{socialImage}}" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:alt" content="linkpeek: TypeScript link previews and URL metadata" />
		<meta name="twitter:title" content="{{title}} · linkpeek" />
		<meta name="twitter:description" content="{{description}}" />
		<meta name="twitter:image" content="{{socialImage}}" />
		<meta name="twitter:image:alt" content="linkpeek: TypeScript link previews and URL metadata" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="theme-color" content="#1b1b1f" />
		<link rel="stylesheet" href="{{base}}assets/styles.css" />
		<script type="application/ld+json">{{structuredData}}</script>
	</head>
	<body class="{{pageClass}}">
		<a class="skip-link" href="#content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="wordmark" href="{{base}}">linkpeek</a>
				<nav class="header-links" aria-label="Project"><a href="{{base}}api/">Docs</a>
					<a href="https://www.npmjs.com/package/linkpeek">npm</a>
					<a href="https://github.com/thegruber/linkpeek">GitHub</a>
				</nav>
			</div>
		</header>
		<div class="docs-shell">
			<aside class="site-sidebar" aria-label="Documentation"><nav>{{navigation}}</nav></aside>
			<main class="docs-main" id="content">
				<details class="mobile-nav"><summary>Documentation</summary><nav>{{navigation}}</nav></details>
				{{breadcrumbs}}{{content}}{{pageTools}}
			</main>
			<aside class="toc-sidebar">{{toc}}</aside>
		</div>
		<footer class="site-footer"><span>linkpeek {{version}} · MIT · Adrian Gruber</span><nav aria-label="Resources"><a href="{{base}}llms.txt">llms.txt</a><a href="{{base}}llms-full.txt">Full text</a><a href="{{base}}sitemap.xml">Sitemap</a><a href="https://github.com/thegruber/linkpeek/releases">Releases</a></nav></footer>
		{{pageScript}}
	</body>
</html>
