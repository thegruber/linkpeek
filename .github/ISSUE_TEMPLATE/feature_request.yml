name: Feature request
description: Suggest a focused improvement to linkpeek.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What link-preview or metadata-extraction problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have one in mind, describe the API or behavior you would like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other packages have you tried?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, or notes about runtime, security, or compatibility requirements.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature.
