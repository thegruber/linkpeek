name: JSR
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify jsr.json matches package.json
        run: |
          node -e "const a=require('./package.json').version,b=require('./jsr.json').version;if(a!==b){console.error('::error::jsr.json '+b+' != package.json '+a);process.exit(1)}"

      - run: npm ci
      # Tokenless: JSR trusts this repository through GitHub OIDC and records provenance.
      - run: npx --yes jsr@0.14.3 publish
