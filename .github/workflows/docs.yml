name: Docs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "package.json"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm install --global npm@11.21.1
      - run: npm ci --prefix website
      # Build for the address Pages serves (base path and host from configure-pages).
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      # linkpeek.js.org is served over HTTPS by JS.ORG's Cloudflare proxy, while
      # Pages reports the custom domain as http://; canonicals must be https.
      - name: Build docs
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          LINKPEEK_DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          export LINKPEEK_DOCS_ORIGIN="https://${PAGES_ORIGIN#*://}"
          npm run build --prefix website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
