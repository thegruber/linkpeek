name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          CI: true
      - run: npm run build
      - run: npm run docs:build
        if: matrix.node-version == 24
      - run: npm run audit
      - run: npm run package:check

  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # npm ci keeps the committed lockfile authoritative; the smoke test then
      # exercises the built dist under the actual Bun runtime.
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run build
      - run: bun test/bun-smoke.ts

  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run build
      - name: Test the packed npm package in Deno
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          CONSUMER="$RUNNER_TEMP/deno-consumer"
          mkdir -p "$CONSUMER/test"
          npm install --prefix "$CONSUMER" --ignore-scripts "$RUNNER_TEMP/linkpeek-$(node -p "require('./package.json').version").tgz"
          cp test/deno-smoke.ts test/runtime-smoke.ts "$CONSUMER/test/"
          cd "$CONSUMER"
          deno run --node-modules-dir=manual test/deno-smoke.ts

  test-minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: node test/package-smoke.mjs
